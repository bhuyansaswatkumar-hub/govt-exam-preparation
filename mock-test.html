/* ================================
   VARIABLES
================================ */

let currentQuestion = 0;

let answers = new Array(questions.length).fill(null);

let studentName = "";

let timeLeft = 30 * 60;

let timerInterval;


/* ================================
   START TEST
================================ */

function startTest() {

    const nameInput =
        document.getElementById("studentName").value.trim();

    if (!nameInput) {

        alert("Please enter your name.");

        return;
    }

    studentName = nameInput;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("testScreen")
        .classList.remove("hidden");

    currentQuestion = 0;

    answers = new Array(questions.length).fill(null);

    renderQuestion();

    renderQuestionGrid();

    startTimer();
}


/* ================================
   TIMER
================================ */

function startTimer() {

    updateTimer();

    timerInterval = setInterval(function() {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            alert("Time is over. Your test will be submitted.");

            finishTest();

        }

    }, 1000);
}


function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
}


/* ================================
   SHOW QUESTION
================================ */

function renderQuestion() {

    const question =
        questions[currentQuestion];

    let html = "";

    html +=
        "<h2>Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length +
        "</h2>";

    html +=
        "<h2>" +
        question.q +
        "</h2>";

    question.options.forEach(function(option, index) {

        const checked =
            answers[currentQuestion] === index
            ? "checked"
            : "";

        html += `
            <label class="option">
                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${checked}
                    onchange="selectAnswer(${index})"
                >
                ${option}
            </label>
        `;

    });

    document.getElementById("questionBox").innerHTML = html;

    updateNavigation();

}


/* ================================
   SELECT ANSWER
================================ */

function selectAnswer(index) {

    answers[currentQuestion] = index;

    renderQuestionGrid();

    updateNavigation();
}


/* ================================
   NEXT
================================ */

function nextQuestion() {

    if (answers[currentQuestion] === null) {

        alert("Please select an answer first.");

        return;
    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        renderQuestion();

        renderQuestionGrid();

    }

}


/* ================================
   PREVIOUS
================================ */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        renderQuestion();

        renderQuestionGrid();

    }

}


/* ================================
   QUESTION GRID
================================ */

function renderQuestionGrid() {

    let html = "";

    questions.forEach(function(_, index) {

        let classes = "question-number";

        if (index === currentQuestion) {

            classes += " current";

        }

        if (answers[index] !== null) {

            classes += " answered";

        }

        html += `
            <div
                class="${classes}"
                onclick="goToQuestion(${index})">
                ${index + 1}
            </div>
        `;

    });

    document.getElementById("questionGrid").innerHTML =
        html;
}


function goToQuestion(index) {

    currentQuestion = index;

    renderQuestion();

    renderQuestionGrid();

}


/* ================================
   NAVIGATION
================================ */

function updateNavigation() {

    const submitButton =
        document.getElementById("submitButton");

    if (currentQuestion === questions.length - 1) {

        submitButton.style.display = "block";

    } else {

        submitButton.style.display = "none";

    }

}


/* ================================
   FINISH TEST
================================ */

function finishTest() {

    clearInterval(timerInterval);

    let correct = 0;

    answers.forEach(function(answer, index) {

        if (answer === questions[index].answer) {

            correct++;

        }

    });

    const wrong =
        questions.length - correct;

    const percentage =
        ((correct / questions.length) * 100)
        .toFixed(1);

    document.getElementById("testScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    document.getElementById("studentResult")
        .textContent =
        "Well done, " + studentName + "!";

    document.getElementById("finalScore")
        .textContent = correct;

    document.getElementById("correctCount")
        .textContent = correct;

    document.getElementById("wrongCount")
        .textContent = wrong;

    document.getElementById("percentage")
        .textContent = percentage + "%";


    let message = "";

    if (percentage >= 80) {

        message =
            "Excellent performance! Keep preparing consistently.";

    } else if (percentage >= 60) {

        message =
            "Good performance. Keep practicing to improve further.";

    } else if (percentage >= 40) {

        message =
            "You are making progress. More practice will help.";

    } else {

        message =
            "Keep studying and practice regularly. You can improve.";

    }

    document.getElementById("performanceMessage")
        .textContent = message;


    saveLocalResult(
        correct,
        percentage
    );

    submitScore(
        correct,
        percentage
    );

    createReview();

}


/* ================================
   LOCAL STORAGE
================================ */

function saveLocalResult(score, percentage) {

    const result = {

        name: studentName,

        score: score,

        total: questions.length,

        percentage: Number(percentage),

        date: new Date().toISOString()

    };


    localStorage.setItem(
        "examPrepCurrentUser",
        JSON.stringify(result)
    );


    let leaderboard = [];

    try {

        leaderboard =
            JSON.parse(
                localStorage.getItem(
                    "examPrepLeaderboard"
                )
            ) || [];

    } catch (error) {

        leaderboard = [];

    }


    leaderboard.push(result);


    localStorage.setItem(
        "examPrepLeaderboard",
        JSON.stringify(leaderboard)
    );

}


/* ================================
   GOOGLE SHEETS SUBMISSION
================================ */

function submitScore(score, percentage) {

    const status =
        document.getElementById("submitStatus");

    status.textContent =
        "Submitting your score...";


    const data = {

        name: studentName,

        score: score,

        percentage: Number(percentage)

    };


    fetch(
        SCRIPT_URL,
        {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type":
                    "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        }
    )
    .then(function() {

        status.textContent =
            "✅ Score submitted to leaderboard.";

    })
    .catch(function(error) {

        console.error(error);

        status.textContent =
            "⚠️ Score saved locally. Please check your internet connection.";

    });

}


/* ================================
   REVIEW
================================ */

function createReview() {

    let html = "";

    questions.forEach(function(question, index) {

        const userAnswer =
            answers[index];

        const correctAnswer =
            question.answer;

        const isCorrect =
            userAnswer === correctAnswer;


        html += `
            <div class="review-item ${
                isCorrect ? "correct" : "wrong"
            }">

                <strong>
                    ${index + 1}. ${question.q}
                </strong>

                <p>
                    Your answer:
                    ${
                        userAnswer !== null
                        ? question.options[userAnswer]
                        : "Not answered"
                    }
                </p>

                <p>
                    Correct answer:
                    <strong>
                        ${question.options[correctAnswer]}
                    </strong>
                </p>

            </div>
        `;

    });

    document.getElementById("review").innerHTML =
        html;

}


/* ================================
   LEADERBOARD
================================ */

function viewLeaderboard() {

    window.location.href =
        "leaderboard.html";

}
