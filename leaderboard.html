<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | SSC & Banking</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #17365d;
    color: white;
    text-align: center;
    padding: 35px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    font-size: 18px;
}

nav {
    background: #0d2542;
    text-align: center;
    padding: 12px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    color: #17365d;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    background: #17365d;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0d2542;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
}

th, td {
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

th {
    background: #17365d;
    color: white;
}

tr:nth-child(even) {
    background: #f4f6f8;
}

.rank {
    font-size: 22px;
}

footer {
    background: #17365d;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
<h1>🏆 SSC & Banking Leaderboard</h1>
<p>Submit Your Mock Test Score</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="study-material.html">Study Material</a>
<a href="mock-test.html">Mock Test</a>
<a href="daily-quiz.html">Daily Quiz</a>
<a href="leaderboard.html">🏆 Leaderboard</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<div class="card">

<h2>📝 Submit Your Score</h2>

<label>Student Name</label>
<input type="text" id="studentName" placeholder="Enter your name">

<label>Score</label>
<input type="number" id="studentScore" placeholder="Example: 18.50" step="0.01" min="0" max="20">

<label>Percentage</label>
<input type="number" id="studentPercentage" placeholder="Example: 92.50" step="0.01" min="0" max="100">

<button type="button" onclick="addScore()">Submit Score</button>

</div>

<div class="card">

<h2>🏆 Top Performers</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Student</th>
<th>Score</th>
<th>Percentage</th>
</tr>
</thead>

<tbody id="leaderboardBody">

<tr>
<td colspan="4">Loading leaderboard...</td>
</tr>

</tbody>

</table>

</div>

</div>

<footer>
<p>© 2026 SSC & Banking Exam Preparation</p>
</footer>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxV1CyjtjBJJlpvIJxEx37AsBms2rStoPck9kcvD9uaN5UpgoTkKT0Y4EQWr77onNNx/exec";


function addScore() {

    let name = document.getElementById("studentName").value.trim();
    let score = parseFloat(document.getElementById("studentScore").value);
    let percentage = parseFloat(document.getElementById("studentPercentage").value);

    if (name === "") {
        alert("Please enter your name.");
        return;
    }

    if (isNaN(score)) {
        alert("Please enter your score.");
        return;
    }

    if (isNaN(percentage)) {
        alert("Please enter your percentage.");
        return;
    }

    fetch(API_URL, {
        method: "POST",
        body: new URLSearchParams({
            name: name,
            score: score,
            percentage: percentage
        })
    })

    .then(response => response.text())

    .then(data => {

        if (data.trim() === "success") {

            alert("Score submitted successfully!");

            document.getElementById("studentName").value = "";
            document.getElementById("studentScore").value = "";
            document.getElementById("studentPercentage").value = "";

            loadLeaderboard();

        } else {

            alert("Score could not be submitted.");

        }

    })

    .catch(error => {

        alert("Error submitting score. Please try again.");

        console.error(error);

    });

}


function loadLeaderboard() {

    fetch(API_URL)

    .then(response => response.json())

    .then(data => {

        let tbody = document.getElementById("leaderboardBody");

        tbody.innerHTML = "";

        if (data.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="4">No scores submitted yet.</td>
                </tr>
            `;

            return;
        }

        data.forEach((row, index) => {

            let rank;

            if (index === 0) {
                rank = "🥇";
            } 
            else if (index === 1) {
                rank = "🥈";
            } 
            else if (index === 2) {
                rank = "🥉";
            } 
            else {
                rank = index + 1;
            }

            let studentName = row[0];
            let score = row[1];
            let percentage = row[2];

            tbody.innerHTML += `
                <tr>
                    <td class="rank">${rank}</td>
                    <td>${studentName}</td>
                    <td>${score} / 20</td>
                    <td>${percentage}%</td>
                </tr>
            `;

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("leaderboardBody").innerHTML = `
            <tr>
                <td colspan="4">Unable to load leaderboard.</td>
            </tr>
        `;

    });

}


window.onload = loadLeaderboard;

</script>

</body>
</html>
