<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | SSC & Banking</title>

<meta name="description"
content="SSC and Banking Exam Leaderboard. Check your mock test score, rank and performance.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #173b75;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

header p {
    margin: 0;
    font-size: 15px;
}

nav {
    background: #0d2852;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 13px 15px;
    font-size: 14px;
}

nav a:hover {
    background: #173b75;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    color: #173b75;
}

.top-three {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.top-card {
    text-align: center;
    padding: 20px;
    border-radius: 10px;
    background: #f8f9fb;
    border: 1px solid #ddd;
}

.top-card .rank {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
}

.top-card .name {
    font-size: 18px;
    font-weight: bold;
    color: #173b75;
    word-break: break-word;
}

.top-card .score {
    margin-top: 8px;
    font-size: 16px;
}

.search-box {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 15px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th {
    background: #173b75;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f5f7fb;
}

.rank-number {
    font-weight: bold;
}

.score-cell {
    font-weight: bold;
    color: #173b75;
}

.percentage {
    font-weight: bold;
}

.exam-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 15px;
    background: #eaf0ff;
    color: #173b75;
    font-size: 12px;
    font-weight: bold;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #666;
}

.error {
    text-align: center;
    padding: 20px;
    color: #b00020;
    background: #fff0f0;
    border-radius: 6px;
}

.refresh-btn {
    background: #173b75;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.refresh-btn:hover {
    background: #0d2852;
}

footer {
    margin-top: 40px;
    background: #173b75;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 14px;
}

@media (max-width: 700px) {

    header h1 {
        font-size: 24px;
    }

    .top-three {
        grid-template-columns: 1fr;
    }

    nav a {
        padding: 10px 8px;
        font-size: 12px;
    }

    .card {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏆 Leaderboard</h1>
    <p>SSC & Banking Exam Preparation</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="ssc.html">SSC</a>
    <a href="banking.html">Banking</a>
    <a href="railway.html">Railway</a>
    <a href="notes.html">Notes</a>
    <a href="mcq.html">MCQ</a>
    <a href="mock-test.html">Mock Test</a>
    <a href="current-affairs.html">Current Affairs</a>
    <a href="daily-quiz.html">Daily Quiz</a>
    <a href="leaderboard.html">Leaderboard</a>
</nav>

<div class="container">

    <div class="card">
        <h2>🏆 Top Performers</h2>

        <div id="topThree" class="top-three">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <div class="card">

        <h2>📊 All Scores</h2>

        <input
            type="text"
            id="searchBox"
            class="search-box"
            placeholder="Search student name or exam..."
        >

        <button class="refresh-btn" onclick="loadLeaderboard()">
            🔄 Refresh Leaderboard
        </button>

        <div id="status" class="loading">
            Loading leaderboard...
        </div>

        <div class="table-wrapper">
            <table id="leaderboardTable" style="display:none;">

                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Student</th>
                        <th>Exam</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="leaderboardBody"></tbody>

            </table>
        </div>

    </div>

</div>

<footer>
    © 2026 Govt Exam Preparation | SSC & Banking
</footer>

<script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxV1CyjtjBJJlpvIJxEx37AsBms2rStoPck9kcvD9uaN5UpgoTkKT0Y4EQWr77onNNx/exec";

let leaderboardData = [];


/* =========================
   LOAD LEADERBOARD
========================= */

async function loadLeaderboard() {

    const status = document.getElementById("status");
    const table = document.getElementById("leaderboardTable");
    const body = document.getElementById("leaderboardBody");
    const topThree = document.getElementById("topThree");

    status.className = "loading";
    status.innerHTML = "Loading leaderboard...";

    table.style.display = "none";

    try {

        const response = await fetch(
            GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime()
        );

        if (!response.ok) {
            throw new Error("Network response failed");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Invalid leaderboard data");
        }

        leaderboardData = data;

        displayTopThree(leaderboardData);
        displayTable(leaderboardData);

        status.style.display = "none";
        table.style.display = "table";

    } catch (error) {

        console.error(error);

        topThree.innerHTML = `
            <div class="error">
                Unable to load leaderboard.
            </div>
        `;

        status.className = "error";
        status.innerHTML =
            "Unable to load scores. Please check the Apps Script deployment.";

    }
}


/* =========================
   TOP 3
========================= */

function displayTopThree(data) {

    const topThree = document.getElementById("topThree");

    if (!data || data.length === 0) {

        topThree.innerHTML = `
            <div class="loading">
                No scores available yet.
            </div>
        `;

        return;
    }

    const top = data.slice(0, 3);

    let html = "";

    top.forEach(function(item, index) {

        const rank = index + 1;

        const name = escapeHTML(
            item.name || "Student"
        );

        const score = Number(item.score) || 0;

        const total = getTotal(item);

        const percentage = Number(item.percentage) || 0;

        html += `
            <div class="top-card">

                <div class="rank">
                    ${getMedal(rank)} #${rank}
                </div>

                <div class="name">
                    ${name}
                </div>

                <div class="score">
                    ${score} / ${total}
                    <br>
                    <strong>${percentage}%</strong>
                </div>

            </div>
        `;
    });

    topThree.innerHTML = html;
}


/* =========================
   TABLE
========================= */

function displayTable(data) {

    const body = document.getElementById("leaderboardBody");

    body.innerHTML = "";

    if (!data || data.length === 0) {

        body.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;">
                    No scores available.
                </td>
            </tr>
        `;

        return;
    }

    data.forEach(function(item, index) {

        const rank = index + 1;

        const name = escapeHTML(
            item.name || "Student"
        );

        const exam = escapeHTML(
            item.exam || "Mock Test"
        );

        const score = Number(item.score) || 0;

        const total = getTotal(item);

        const percentage = Number(item.percentage) || 0;

        const date = formatDate(item.date);

        body.innerHTML += `

            <tr>

                <td class="rank-number">
                    ${rank}
                </td>

                <td>
                    ${name}
                </td>

                <td>
                    <span class="exam-badge">
                        ${exam}
                    </span>
                </td>

                <td class="score-cell">
                    ${score} / ${total}
                </td>

                <td class="percentage">
                    ${percentage}%
                </td>

                <td>
                    ${date}
                </td>

            </tr>

        `;
    });
}


/* =========================
   SEARCH
========================= */

document.getElementById("searchBox").addEventListener(
    "input",
    function() {

        const searchText =
            this.value.toLowerCase().trim();

        const filtered =
            leaderboardData.filter(function(item) {

                const name =
                    String(item.name || "")
                    .toLowerCase();

                const exam =
                    String(item.exam || "")
                    .toLowerCase();

                return (
                    name.includes(searchText) ||
                    exam.includes(searchText)
                );

            });

        displayTable(filtered);
    }
);


/* =========================
   TOTAL MARKS
========================= */

function getTotal(item) {

    if (item.total && Number(item.total) > 0) {
        return Number(item.total);
    }

    const exam =
        String(item.exam || "").toLowerCase();

    if (
        exam.includes("mcq")
    ) {
        return 30;
    }

    return 50;
}


/* =========================
   DATE FORMAT
========================= */

function formatDate(value) {

    if (!value) {
        return "-";
    }

    try {

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return "-";
        }

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    } catch (error) {

        return "-";
    }
}


/* =========================
   MEDALS
========================= */

function getMedal(rank) {

    if (rank === 1) {
        return "🥇";
    }

    if (rank === 2) {
        return "🥈";
    }

    if (rank === 3) {
        return "🥉";
    }

    return "🏅";
}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

loadLeaderboard();


/* Refresh when page becomes visible */

document.addEventListener(
    "visibilitychange",
    function() {

        if (!document.hidden) {
            loadLeaderboard();
        }

    }
);

</script>

</body>
</html>
